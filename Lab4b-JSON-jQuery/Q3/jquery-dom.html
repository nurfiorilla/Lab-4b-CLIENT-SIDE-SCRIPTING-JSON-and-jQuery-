<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare Native JavaScript and jQuery</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    div, button { margin-bottom: 1rem; }
    .myStyle { background-color: coral; padding: 16px; }
  </style>
</head>
<body>
  <div id="myElement">Original Text</div>
  <div id="myDIV"><p>I am a myDIV.</p></div>
  <button id="myButton">Click me</button>

  <!-- jQuery 4.0.0 (official full build, not slim) -->
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <script>
    $(function () {
      // (a) Native: document.getElementById("myElement").textContent = "Modified Text";
      $("#myElement").text("Modified Text");

      // (b) Native: document.querySelector("#myDIV").classList.add("myStyle");
      $("#myDIV").addClass("myStyle");

      // (c) Native: document.getElementById("myButton").addEventListener("click", () => alert("Button clicked!"));
      $("#myButton").on("click", function () {
        alert("Button clicked!");
      });
    });
  </script>
</body>
</html>
