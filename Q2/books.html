<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 4b Q2 </title>
  <style>
    body {  max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: #222; }
    .error { background: #fdecea; color: #8a1c1c; border: 1px solid #e0a5a5; padding: .75rem 1rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Book Information</h1>

  <h2>(a) Title of the first book</h2>
  <p id="firstTitle">Loading...</p>

  <h2>(b) Author of the second book</h2>
  <p id="secondAuthor">Loading...</p>

  <h2>(c) Genres of both books</h2>
  <div id="genres"><p>Loading...</p></div>

  <div id="error" role="alert"></div>

  <script>
    function showError(message) {
      const box = document.getElementById("error");
      box.textContent = "";
      const p = document.createElement("p");
      p.className = "error";
      p.textContent = message;
      box.appendChild(p);

      document.getElementById("firstTitle").textContent = "Not available";
      document.getElementById("secondAuthor").textContent = "Not available";
      document.getElementById("genres").textContent = "Not available";
    }

    async function loadBooks() {
      try {
        const response = await fetch("books.json");
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json(); 
        
        // Log the successful result to the browser console
        console.log("Success! Loaded book data:", data);

        if (!data || !Array.isArray(data.books) || data.books.length < 2) {
          throw new Error("Unexpected data structure");
        }

        const books = data.books;

        // (a) Title of 1st book
        document.getElementById("firstTitle").textContent = books[0].title;

        // (b) Author of 2nd book
        document.getElementById("secondAuthor").textContent = books[1].author;

        // (c) Genres of both books, grouped by title
        const genresDiv = document.getElementById("genres");
        genresDiv.textContent = "";
        books.forEach(function (book) {
          const p = document.createElement("p");
          const strong = document.createElement("strong");
          strong.textContent = book.title;
          p.appendChild(strong);
          p.appendChild(document.createTextNode(" \u2014 " + book.genres.join(", ")));
          genresDiv.appendChild(p);
        });
      } catch (err) {
        console.error(err);
        showError("Error: Unable to load book information.");
      }
    }

    loadBooks();
  </script>
</body>
</html>
